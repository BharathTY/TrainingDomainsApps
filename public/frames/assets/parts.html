<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Parts catalogue frame</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0.75rem; font-size: 14px; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid #ccc; padding: 0.3rem 0.45rem; text-align: left; }
      input { width: 100%; margin-bottom: 0.5rem; }
    </style>
  </head>
  <body>
    <h1>Parts catalogue</h1>
    <label>Search parts
      <input id="parts-search" name="parts-search" type="search" data-testid="parts-search" placeholder="Filter SKU">
    </label>
    <table data-testid="parts-table">
      <caption>Spare parts</caption>
      <thead>
        <tr>
          <th scope="col">SKU</th>
          <th scope="col">Name</th>
          <th scope="col">Stock</th>
        </tr>
      </thead>
      <tbody>
        <tr data-sku="FLT-01"><td>FLT-01</td><td>Filter kit</td><td>24</td></tr>
        <tr data-sku="BAT-09"><td>BAT-09</td><td>Battery pack</td><td>8</td></tr>
        <tr data-sku="SSD-12"><td>SSD-12</td><td>SSD module</td><td>15</td></tr>
      </tbody>
    </table>
    <script>
      document.getElementById("parts-search").addEventListener("input", function (event) {
        var q = event.target.value.toLowerCase()
        document.querySelectorAll("#parts-table tbody tr").forEach(function (row) {
          row.hidden = q && !row.textContent.toLowerCase().includes(q)
        })
      })
    </script>
  </body>
</html>
