<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Billing form frame</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1rem; }
      label { display: block; margin-top: 0.5rem; font-size: 0.9rem; }
      input, select, button { margin-top: 0.25rem; }
    </style>
  </head>
  <body>
    <h1>Mock billing form</h1>
    <form id="frame-billing-form" data-testid="frame-billing-form">
      <label>Invoice reference
        <input id="invoice-ref" name="invoiceRef" type="text" required maxlength="20" value="INV-TRAIN-001">
      </label>
      <label>Amount (INR)
        <input id="amount" name="amount" type="number" min="1" step="0.01" required value="1500">
      </label>
      <label>Payment method
        <select id="method" name="method">
          <option value="cash">Cash</option>
          <option value="card">Card</option>
          <option value="upi">UPI</option>
        </select>
      </label>
      <button type="submit" id="frame-billing-submit" data-testid="frame-billing-submit">Submit payment</button>
    </form>
    <p id="frame-billing-result" data-testid="frame-billing-result" aria-live="polite"></p>
    <script>
      document.getElementById("frame-billing-form").addEventListener("submit", function (event) {
        event.preventDefault()
        var amount = document.getElementById("amount").value
        document.getElementById("frame-billing-result").textContent =
          "Recorded synthetic payment of INR " + amount
        if (window.parent !== window) {
          window.parent.postMessage({ type: "hospital-billing", amount: amount }, "*")
        }
      })
    </script>
  </body>
</html>
